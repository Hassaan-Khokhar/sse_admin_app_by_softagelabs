include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
  errors:
    # The wire strings in enums.dart are the contract with the student app.
    # An unhandled case in a switch over them is a sync bug, not a style nit.
    missing_enum_case_clauses: error
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_parenthesis

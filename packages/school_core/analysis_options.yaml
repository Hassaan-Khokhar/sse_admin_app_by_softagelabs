include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_parenthesis
    # The wire strings in enums.dart are the contract with the student app.
    # A switch that misses a case is a sync bug, not a style nit. (Dart 3
    # already enforces this for switch *expressions*; this covers statements.)
    - exhaustive_cases
